[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-builder"
version = "0.1.0"
description = "Auditable Instagram creator analysis and discovery MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]
sheets = [
    "google-api-python-client>=2.170,<3",
    "google-auth>=2.40,<3",
]

[project.scripts]
ai-product-builder = "ai_product_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
